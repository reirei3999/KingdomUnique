plugins {
    id 'fabric-loom' version '1.7-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.blamejared.com/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // The standalone common API uses Mojang names; Fabric bundles its remapped API.
    modCompileOnly("mezz.jei:jei-1.21.1-fabric:${project.jei_version}") { transitive = false }
    modLocalRuntime("mezz.jei:jei-1.21.1-fabric:${project.jei_version}") { transitive = false }
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

sourceSets {
    gametest {
        compileClasspath += main.output + main.compileClasspath
        runtimeClasspath += main.runtimeClasspath
    }
}

loom {
    mods {
        kingdomunique {
            sourceSet sourceSets.main
        }
        kingdomunique_gametest {
            sourceSet sourceSets.gametest
        }
    }
    runs {
        gameTest {
            server()
            source sourceSets.gametest
            runDir 'build/gametest'
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.file('gametest-results.xml').get().asFile}"
        }
    }
}

def targetJavaVersion = 21

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(targetJavaVersion)
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}

// 起動確認用: -Dkingdomunique.verify.seconds=N を渡すと、
// N 秒後にクライアントを自動終了させるプロパティをゲームJVMへ引き継ぐ。
tasks.named("runClient") {
    def verifySeconds = System.getProperty("kingdomunique.verify.seconds")
    if (verifySeconds != null) {
        jvmArgs "-Dkingdomunique.verify.seconds=${verifySeconds}"
    }
}
